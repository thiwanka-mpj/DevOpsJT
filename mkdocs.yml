site_name: DevOpsJT 
site_description: >-
  A complete well-structured DevOps Engineering knowledge base - 160+ lecture notes
  covering Linux, Git, Docker, Kubernetes, CI/CD, Terraform, Ansible, Cloud and
  Monitoring, built for revision and interview preparation.
site_author: Janith Thiwanka
site_url: https://thiwanka-mpj.github.io/DevOpsJT/

repo_name: thiwanka-mpj/DevOpsJT
repo_url: https://github.com/thiwanka-mpj/DevOpsJT

copyright: Copyright @ 2026 - Janith Thiwanka

docs_dir: docs
site_dir: site

# ---------------------------------------------------------------------------
# THEME
# ---------------------------------------------------------------------------
theme:
  name: material
  # custom_dir: overrides   # uncomment if you add files under overrides/ (e.g. custom footer/partials)
  language: en

  # Using a built-in icon so the site builds out-of-the-box with no assets.
  # Swap in your own artwork any time:
  #   favicon: images/favicon.png
  #   logo: images/logo.png

  icon:
    logo: material/kubernetes
    repo: fontawesome/brands/github

    admonition:
      note: octicons/tag-16
      abstract: octicons/checklist-16
      tip: octicons/squirrel-16
      example: octicons/beaker-16

  palette:

    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo

  font:
    text: Inter
    code: JetBrains Mono

  features:
    # --- Navigation ---
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - navigation.prune
    - navigation.path
    - toc.follow
    # - toc.integrate

    # --- Search ---
    - search.suggest
    - search.highlight
    - search.share

    # --- Header ---
    - header.autohide

    # --- Content ---
    - content.code.copy
    - content.code.annotate
    - content.code.select
    - content.tabs.link
    - content.tooltips

# ---------------------------------------------------------------------------
# PLUGINS
# ---------------------------------------------------------------------------
plugins:
  - typeset

  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'

  - awesome-pages:
      collapse_single_pages: false
      strict: false

  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      zoomable: true
      draggable: true

  - git-revision-date-localized:
      enabled: !ENV [CI, false]
      type: date
      enable_creation_date: true
      fallback_to_build_date: true

  - minify:
      minify_html: true

  # Social cards require cairo/pango system libraries.
  # Uncomment once those are installed on your build machine / CI image.
  # - social

# ---------------------------------------------------------------------------
# MARKDOWN EXTENSIONS
# ---------------------------------------------------------------------------
markdown_extensions:
  # Python-Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
      title: On this page

  # PyMdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.critic
  - pymdownx.details
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg  
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: thiwanka-mpj
      repo: DevOpsJT
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path: docs
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: false

# ---------------------------------------------------------------------------
# EXTRA CSS / JS
# ---------------------------------------------------------------------------
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

# ---------------------------------------------------------------------------
# EXTRA (social links, versioning, analytics placeholders)
# ---------------------------------------------------------------------------
extra:
  homepage: https://thiwanka-mpj.github.io/DevOpsJT/

  social:
    - icon: fontawesome/brands/github
      link: https://github.com/thiwanka-mpj
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/janith-thiwanka-mpj/
      name: LinkedIn
    #- icon: fontawesome/brands/youtube
    #  link: https://youtube.com/@yourchannel
    #  name: YouTube
    #- icon: fontawesome/solid/globe
    #  link: https://yourwebsite.com
    #  name: Website

  # Google Analytics (optional) — replace with your property ID and uncomment
  # analytics:
  #   provider: google
  #   property: G-XXXXXXXXXX
  #   feedback:
  #     title: Was this page helpful?
  #     ratings:
  #       - icon: material/emoticon-happy-outline
  #         name: This page was helpful
  #         data: 1
  #         note: Thanks for the feedback!
  #       - icon: material/emoticon-sad-outline
  #         name: This page could be improved
  #         data: 0
  #         note: Thanks — feel free to open an issue with suggestions.

  version:
    provider: mike
    default: latest

  status:
    new: Recently added
    deprecated: Deprecated

  consent:
    title: Cookie consent
    description: >-
      This site uses cookies only to recognize repeat visits and preferences
      such as dark/light mode. No personal data is collected.

# ---------------------------------------------------------------------------
# NAVIGATION
# ---------------------------------------------------------------------------
# Top-level tabs are hand-authored here. Everything under "DevOps Course" is
# resolved automatically by the awesome-pages plugin from docs/devops-course/
# (see docs/devops-course/.pages). This means you NEVER edit this file again
# when adding Day 04...Day 160 — just drop in a new day-XXX/ folder.
nav:
  - Home: index.md
  - About: about.md
  - Learning Roadmap: roadmap.md  
  - DevOps Engineering Course:
    - 'Course Overview':
      - 'Course Overview': devops-course/index.md
    - 'Lessons':
      - 'Day 001': devops-course/day-001.md
      - 'Day 002': devops-course/day-002.md
  - Resources: resources.md
  
